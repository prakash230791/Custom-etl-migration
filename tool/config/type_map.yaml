# SQL Server -> PostgreSQL type mapping
# Used by aurora_ddl.py and stage2 generators

type_mappings:
  NVARCHAR: TEXT
  VARCHAR: TEXT
  CHAR: CHAR
  NCHAR: CHAR
  INT: INTEGER
  BIGINT: BIGINT
  SMALLINT: SMALLINT
  TINYINT: SMALLINT
  BIT: BOOLEAN
  DECIMAL: DECIMAL
  NUMERIC: NUMERIC
  FLOAT: DOUBLE PRECISION
  REAL: REAL
  DATETIME: TIMESTAMP
  DATETIME2: TIMESTAMP
  DATE: DATE
  TIME: TIME
  UNIQUEIDENTIFIER: UUID
  VARBINARY: BYTEA
  IMAGE: BYTEA
  TEXT: TEXT
  NTEXT: TEXT
  XML: XML
  MONEY: DECIMAL(19,4)
  SMALLMONEY: DECIMAL(10,4)

ambiguous_mappings:
  - NVARCHAR(MAX)
  - VARCHAR(MAX)
  - SQL_VARIANT
  - GEOGRAPHY
  - GEOMETRY
